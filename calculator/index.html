<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        input {
            width: 100px;
            height: 30px;
            font-size: 20px;
            padding: 5px;
        }
        button {
            width: 100px;
            height: 30px;
            font-size: 20px;
            padding: 5px;
        }
        p {
            font-size: 20px;
        }
    </style>
  <title>Calculator</title>
</head>
<body>
  <h1>Calculator</h1>
  <input type="number" id="num1" placeholder="Number 1">
  <input type="number" id="num2" placeholder="Number 2">
  <button id="add">+</button>
  <button id="subtract">-</button>
  <button id="multiply">*</button>
  <button id="divide">/</button>
  <p id="result">Result: </p>

  <script>
    const resultDisplay = document.getElementById('result');

    function calculate(op) {
      const num1 = +document.getElementById('num1').value; // + converts to number
      const num2 = +document.getElementById('num2').value;

      // Demonstrating == vs ===
      if (num1 == '' || num2 == '') {
        resultDisplay.textContent = 'Please enter valid numbers';
        return;
      }

      let result;
      switch (op) {
        case '+': result = num1 + num2; break;
        case '-': result = num1 - num2; break;
        case '*': result = num1 * num2; break;
        case '/': result = num1 / num2; break;
      }
      resultDisplay.textContent = `Result: ${result}`;
    }

    document.getElementById('add').addEventListener('click', () => calculate('+'));
    document.getElementById('subtract').addEventListener('click', () => calculate('-'));
    document.getElementById('multiply').addEventListener('click', () => calculate('*'));
    document.getElementById('divide').addEventListener('click', () => calculate('/'));
  </script>
</body>
</html>
