<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0; padding: 0;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 10px;
            text-align: center;
        }
        main {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .todoform {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }
        input {
            padding: 10px;
            margin: 0 10px;
            font-size: 16px;
            border: none;
            background-color: #333;
            color: #fff;
            border-radius: 25px;
        }
        button {
            padding: 10px 20px;
            margin: 0 10px;
            font-size: 16px;
            border: none;
            background-color: #333;
            color: #fff;
            cursor: pointer;
            border-radius: 25px;
        }
        button:hover {
            background-color: #555;
        }
        .todo-list {
            margin-top: 20px;
        }
        .todo-list h3 {
            font-size: 20px;
            margin-bottom: 10px;
        }
        .todo-list ul {
            list-style: none;
            padding: 0;
        }
        .todo-list li {
            padding: 10px;
            border-bottom: 1px solid #ccc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .todo-list li button {
            padding: 5px 10px;
            font-size: 16px;
            border: none;
            background-color: #333;
            color: #fff;
            cursor: pointer;
            border-radius: 25px;
        }
        .todo-list li button:hover {
            background-color: #555;
        }
    </style>
  <title>To-Do List</title>
</head>
<body>
    <header>
        <h1>To-Do List</h1>
        <h2>Add, delete, or mark tasks as completed</h2>
    </header>
    <main>
        <div class="todoform">
            <input type="text" id="taskInput" placeholder="Add a task">
            <button id="addTaskBtn">Add Task</button>
        </div>
        <div class="todo-list">
            <h3>Tasks:</h3>
            <ul id="taskList"></ul>
        </div>
    </main>
  <script>
    const taskInput = document.getElementById('taskInput');
    const addTaskBtn = document.getElementById('addTaskBtn');
    const taskList = document.getElementById('taskList');

    // Closures: Task Manager
    function taskManager() {
      let tasks = []; // Closure variable
      return {
        addTask(task) {
          tasks.push(task);
          console.log(`Task added: ${task}`);
        },
        deleteTask(index) {
          tasks.splice(index, 1);
          console.log(`Task deleted at index ${index}`);
        },
        getTasks() {
          return tasks;
        }
      };
    }

    const manager = taskManager();

    addTaskBtn.addEventListener('click', function () {
      const taskText = taskInput.value;
      if (taskText) {
        manager.addTask(taskText);

        const li = document.createElement('li');
        li.innerHTML = `${taskText} <button class="deleteBtn">Delete</button>`;
        taskList.appendChild(li);

        // `this` in Event Listeners
        li.querySelector('.deleteBtn').addEventListener('click', function () {
          const taskIndex = Array.from(taskList.children).indexOf(li);
          manager.deleteTask(taskIndex);
          taskList.removeChild(li);
        });
      }
      taskInput.value = '';
    });
  </script>
</body>
</html>
