<!DOCTYPE html>
<html>
<head>
  <title>To-Do List</title>
</head>
<body>
  <h1>To-Do List</h1>
  <input type="text" id="taskInput" placeholder="Add a task">
  <button id="addTaskBtn">Add Task</button>
  <ul id="taskList"></ul>

  <script>
    const taskInput = document.getElementById('taskInput');
    const addTaskBtn = document.getElementById('addTaskBtn');
    const taskList = document.getElementById('taskList');

    // Closures: Task Manager
    function taskManager() {
      let tasks = []; // Closure variable
      return {
        addTask(task) {
          tasks.push(task);
          console.log(`Task added: ${task}`);
        },
        deleteTask(index) {
          tasks.splice(index, 1);
          console.log(`Task deleted at index ${index}`);
        },
        getTasks() {
          return tasks;
        }
      };
    }

    const manager = taskManager();

    addTaskBtn.addEventListener('click', function () {
      const taskText = taskInput.value;
      if (taskText) {
        manager.addTask(taskText);

        const li = document.createElement('li');
        li.innerHTML = `${taskText} <button class="deleteBtn">Delete</button>`;
        taskList.appendChild(li);

        // `this` in Event Listeners
        li.querySelector('.deleteBtn').addEventListener('click', function () {
          const taskIndex = Array.from(taskList.children).indexOf(li);
          manager.deleteTask(taskIndex);
          taskList.removeChild(li);
        });
      }
      taskInput.value = '';
    });
  </script>
</body>
</html>
